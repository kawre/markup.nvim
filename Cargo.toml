[package]
name = "markup"
version = "0.8.0"
edition = "2024"
autoexamples = false

[lib]
path = "lua/markup/core/lib.rs"
name = "markup_core"
crate-type = ["rlib", "cdylib"]

[profile.dev]
debug = true

[dependencies]
mlua = { version = "0.11.1", features = ["module", "luajit"] }
nucleo-matcher = "0.3.1"
