name: Release

# release-please keeps a pull request "chore(master): release x.y.z" up to date
# from the conventional commits on master: the version in Cargo.toml,
# lua/markup/config.lua and the lines of the docs marked
# `x-release-please-version`, and CHANGELOG.md. Merging it tags the commit and
# makes the GitHub release, and the engine is then built for each platform and
# attached to it, for build.lua to download, with the skill as a zip for those
# who add it by hand. The Claude Code plugin in .claude-plugin carries the same
# version.
#
# Its pull request needs CI to pass like any other. A pull request opened with
# the default GITHUB_TOKEN starts no workflow, so set RELEASE_PLEASE_TOKEN: a
# fine-grained token for this repository with Contents and Pull requests
# read and write.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  engine:
    name: Engine (${{ matrix.asset }})
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, asset: linux-x86_64, lib: libmarkup_core.so }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, asset: linux-arm64, lib: libmarkup_core.so }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: macos-arm64, lib: libmarkup_core.dylib }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: macos-x86_64, lib: libmarkup_core.dylib }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: windows-x86_64, lib: markup_core.dll }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      # Named for the platform, with the extension the library has there.
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lib=target/${{ matrix.target }}/release/${{ matrix.lib }}
          name=markup_core-${{ matrix.asset }}.${lib##*.}
          cp "$lib" "$name"
          gh release upload "${{ needs.release-please.outputs.tag }}" "$name" --clobber

  skill:
    name: Skill
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      # The skill folder as it is, for agents and apps that take a zip.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd skills && zip -qr ../markup-nvim-skill.zip markup-nvim)
          gh release upload "${{ needs.release-please.outputs.tag }}" markup-nvim-skill.zip --clobber
