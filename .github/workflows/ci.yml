name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels the run for the push before it. On
# master each commit has a group of its own, so each one gets a result: in one
# group a run waiting behind another is replaced by the next one that comes.
# The runs of master still go one after another: the Changes job waits for the
# ones started before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # What a change touches, so jobs with nothing to check are skipped: a pull
  # request of docs runs no build, one of Lua no Clippy. A manual run checks
  # everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    # Long enough to wait for the runs of master before this one.
    timeout-minutes: 60
    # The files of a pull request come from the API, which needs this, and so
    # do the runs of master before this one.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      rust: ${{ steps.all.outputs.rust }}
      lua: ${{ steps.all.outputs.lua }}
      code: ${{ steps.all.outputs.code }}
    steps:
      # The runs of master go one after another, in the order of the pushes:
      # every job waits on this one, and this one on the runs of master that
      # started before it. Pull requests do not wait.
      - name: Wait for earlier runs on master
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while true; do
            earlier=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=master&event=push&per_page=50" \
              --jq '[.workflow_runs[] | select(.id < ${{ github.run_id }}) | select(.status != "completed")] | length')
            [ "$earlier" = 0 ] && break
            echo "Waiting for $earlier earlier run(s) on master"
            sleep 15
          done
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release metadata
        id: release
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          only=$(python3 scripts/release_only.py "$BASE" "$GITHUB_SHA")
          echo "only=$only" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - "Cargo.toml"
              - "Cargo.lock"
              - ".cargo/**"
              - "lua/markup/core/**/*.rs"
            lua:
              - "lua/**/*.lua"
              - "tests/**"
              - "scripts/minimal_init.lua"
              - "scripts/run_browser_suite.sh"
              - "scripts/run_tests.sh"
              - "scripts/coverage.lua"
              - "Makefile"
              - ".stylua.toml"
            ci:
              - ".github/workflows/ci.yml"
              - "codecov.yml"
              - "scripts/release_only.py"
      - id: all
        env:
          EVERYTHING: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ci == 'true' }}
          RELEASE_ONLY: ${{ steps.release.outputs.only }}
          RUST_CHANGED: ${{ steps.filter.outputs.rust }}
          LUA_CHANGED: ${{ steps.filter.outputs.lua }}
        run: |
          rust=$([ "$EVERYTHING" = true ] || [ "$RUST_CHANGED" = true ] && echo true || echo false)
          lua=$([ "$EVERYTHING" = true ] || [ "$LUA_CHANGED" = true ] && echo true || echo false)
          if [ "$RELEASE_ONLY" = true ]; then rust=false; lua=false; fi
          code=$([ "$rust" = true ] || [ "$lua" = true ] && echo true || echo false)
          { echo "rust=$rust"; echo "lua=$lua"; echo "code=$code"; } >> "$GITHUB_OUTPUT"
          echo "Rust changed: $rust, Lua changed: $lua" >> "$GITHUB_STEP_SUMMARY"

  format:
    name: Format
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check lua tests scripts
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  lint:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  # Linux only: Windows runners cost twice the minutes of Linux ones and
  # macOS ten times, on a private repository.
  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The engine built from the same sources before: no toolchain, no build.
      - uses: actions/cache@v4
        id: engine
        with:
          path: target/release/libmarkup_core.so
          key: engine-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/**', 'lua/markup/core/**/*.rs') }}
      - if: steps.engine.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.engine.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.engine.outputs.cache-hit != 'true'
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: markup_core-${{ runner.os }}-${{ runner.arch }}
          path: target/release/libmarkup_core.so
          if-no-files-found: error

  test-engine:
    name: Engine tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The test binaries link against LuaJIT, Neovim provides it otherwise.
      - run: sudo apt-get update && sudo apt-get install -y libluajit-5.1-dev
      - run: cargo test

  versions:
    name: Neovim versions
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      # The newest patch of every release line from `min_nvim` in
      # lua/markup/config.lua up, and nightly.
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          min=$(sed -n 's/^[[:space:]]*min_nvim = "\(.*\)",$/\1/p' lua/markup/config.lua)
          test -n "$min" || { echo "::error::min_nvim not found in lua/markup/config.lua"; exit 1; }
          gh api 'repos/neovim/neovim/releases?per_page=100' --paginate \
            --jq '.[] | select(.draft or .prerelease | not) | .tag_name' > tags.txt
          # The version of today's nightly, shown as "v0.13.0-dev-2148+g2843068c7a nightly".
          gh api repos/neovim/neovim/releases/tags/nightly --jq .body > nightly.txt
          matrix=$(MIN="$min" python3 -c '
          import json, os, re
          parse = lambda v: tuple(int(x) for x in v.lstrip("v").split("."))
          tags = [t.strip() for t in open("tags.txt") if re.fullmatch(r"v\d+\.\d+\.\d+", t.strip())]
          tags = sorted({t for t in tags if parse(t) >= parse(os.environ["MIN"])}, key=parse)
          # The newest patch of each release line, such as v0.11.7 for 0.11.
          latest = {}
          for t in tags:
              latest[parse(t)[:2]] = t
          nightly = re.search(r"NVIM (v\S+)", open("nightly.txt").read())
          label = nightly.group(1) + " nightly" if nightly else "nightly"
          # One key, so GitHub names each job after it: "Tests (Neovim
          # v0.11.7)". A name using matrix variables shows unexpanded on a
          # skipped job.
          include = [{"neovim": "Neovim " + t} for t in latest.values()]
          include.append({"neovim": "Neovim " + label})
          print(json.dumps({"include": include}))
          ')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Testing on Neovim $min and up: $matrix" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Tests
    needs: [versions, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every version at once, each on the engine the build job made.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: markup_core-Linux-X64
          path: target/release
      # The version to install from the label: "Neovim v0.11.7" is v0.11.7,
      # "Neovim v0.13.0-dev-... nightly" is nightly.
      - id: version
        shell: bash
        run: |
          v="${{ matrix.neovim }}"
          v="${v#Neovim }"
          [[ $v == *" nightly" ]] && v=nightly
          echo "neovim=$v" >> "$GITHUB_OUTPUT"
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ steps.version.outputs.neovim }}
      - run: nvim --version | head -n 1
      - run: make test_lua

  browser:
    name: Browser layout comparisons
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: markup_core-Linux-X64
          path: target/release
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: google-chrome --version
      - run: nvim -u NONE -l tests/browser/compare.lua
      - run: make test_lua BROWSER=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-comparison-report
          path: .tests/browser-report.jsonl
          include-hidden-files: true

  coverage-lua:
    name: Coverage (Lua)
    needs: [changes, build]
    if: needs.changes.outputs.lua == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: markup_core-Linux-X64
          path: target/release
      # Measured on the Neovim users have, not on nightly.
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      # LuaCov in .tests/rocks, installed once for each version of the Makefile.
      - uses: actions/cache@v4
        id: rocks
        with:
          path: .tests/rocks
          key: rocks-${{ hashFiles('Makefile') }}
      # Only for LuaRocks, which LuaJIT cannot run: its manifest has more
      # constants than LuaJIT allows in a function. LuaCov is plain Lua and
      # runs in Neovim's LuaJIT.
      - if: steps.rocks.outputs.cache-hit != 'true'
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1.5"
      - if: steps.rocks.outputs.cache-hit != 'true'
        uses: leafo/gh-actions-luarocks@v5
      # The headers cluacov builds against.
      - if: steps.rocks.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libluajit-5.1-dev

      - name: Lua coverage
        shell: bash
        run: |
          make coverage_lua SKIP_BUILD=1 | tee lua-coverage.txt
          {
            echo '### Lua coverage'
            echo '```'
            tail -n 1 lua-coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lua
          path: .tests/coverage/lua.lcov
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .tests/coverage/lua.lcov
          flags: lua
          fail_ci_if_error: false

  coverage-rust:
    name: Coverage (Rust)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: sudo apt-get update && sudo apt-get install -y libluajit-5.1-dev

      - name: Rust coverage
        shell: bash
        run: |
          make coverage_rust | tee rust-coverage.txt
          {
            echo '### Rust coverage'
            echo '```'
            grep -E '^(Filename|TOTAL)' rust-coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-rust
          path: .tests/coverage/rust.lcov
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .tests/coverage/rust.lcov
          flags: rust
          fail_ci_if_error: false

  # The one check branch protection requires: every job above passed, or was
  # skipped for having nothing to check. Their
  # names change with the Neovim versions, this one does not.
  ci:
    name: All checks
    if: always()
    needs: [changes, format, lint, build, versions, test-engine, test, browser, coverage-lua, coverage-rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Skipped is fine: nothing it checks changed.
      - name: Every job passed or had nothing to check
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(. == "success" or . == "skipped")'
