name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels the run for the push before it. Every
# push to master runs to the end, so each commit there has a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check lua tests scripts
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: markup_core-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/libmarkup_core.so
            target/release/libmarkup_core.dylib
          if-no-files-found: error

  test-engine:
    name: Engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The test binaries link against LuaJIT, Neovim provides it otherwise.
      - run: sudo apt-get update && sudo apt-get install -y libluajit-5.1-dev
      - run: cargo test

  versions:
    name: Neovim versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      # The newest patch of every release line from `min_nvim` in
      # lua/markup/config.lua up, and nightly.
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          min=$(sed -n 's/^[[:space:]]*min_nvim = "\(.*\)",$/\1/p' lua/markup/config.lua)
          test -n "$min" || { echo "::error::min_nvim not found in lua/markup/config.lua"; exit 1; }
          gh api 'repos/neovim/neovim/releases?per_page=100' --paginate \
            --jq '.[] | select(.draft or .prerelease | not) | .tag_name' > tags.txt
          # The version of today's nightly, shown as "v0.13.0-dev-2148+g2843068c7a nightly".
          gh api repos/neovim/neovim/releases/tags/nightly --jq .body > nightly.txt
          matrix=$(MIN="$min" python3 -c '
          import json, os, re
          parse = lambda v: tuple(int(x) for x in v.lstrip("v").split("."))
          tags = [t.strip() for t in open("tags.txt") if re.fullmatch(r"v\d+\.\d+\.\d+", t.strip())]
          tags = sorted({t for t in tags if parse(t) >= parse(os.environ["MIN"])}, key=parse)
          # The newest patch of each release line, such as v0.11.7 for 0.11.
          latest = {}
          for t in tags:
              latest[parse(t)[:2]] = t
          nightly = re.search(r"NVIM (v\S+)", open("nightly.txt").read())
          label = nightly.group(1) + " nightly" if nightly else "nightly"
          include = [{"neovim": t, "label": t} for t in latest.values()]
          include.append({"neovim": "nightly", "label": label})
          print(json.dumps({"include": include}))
          ')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Testing on Neovim $min and up: $matrix" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Tests (Neovim ${{ matrix.label }})
    needs: [versions, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every version at once, each on the engine the build job made.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: markup_core-Linux-X64
          path: target/release
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - run: nvim --version | head -n 1
      - run: make test_lua

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: sudo apt-get update && sudo apt-get install -y libluajit-5.1-dev
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly
      # Only for LuaRocks, which LuaJIT cannot run: its manifest has more
      # constants than LuaJIT allows in a function. LuaCov is plain Lua and
      # runs in Neovim's LuaJIT.
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1.5"
      - uses: leafo/gh-actions-luarocks@v5

      - name: Lua coverage
        shell: bash
        # Names every case as it starts and ends, on stderr and at once.
        env:
          MARKUP_TEST_TRACE: "1"
        run: |
          make coverage_lua | tee lua-coverage.txt
          {
            echo '### Lua coverage'
            echo '```'
            tail -n 1 lua-coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rust coverage
        shell: bash
        run: |
          make coverage_rust | tee rust-coverage.txt
          {
            echo '### Rust coverage'
            echo '```'
            grep -E '^(Filename|TOTAL)' rust-coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .tests/coverage/*.lcov

      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .tests/coverage/lua.lcov
          flags: lua
          fail_ci_if_error: false
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .tests/coverage/rust.lcov
          flags: rust
          fail_ci_if_error: false

  windows:
    name: Windows (Neovim nightly)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly
      - name: Where Neovim keeps LuaJIT
        shell: pwsh
        run: |
          $bin = Split-Path (Get-Command nvim).Source
          "bin: $bin"
          Get-ChildItem $bin | Select-Object Name, Length | Format-Table -AutoSize
          nvim --version | Select-Object -First 3
      - name: Build
        shell: pwsh
        run: cargo build --release
      - name: Tests
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/echasnovski/mini.test deps/mini.test
          nvim --headless --noplugin -u ./scripts/minimal_init.lua -c "lua MiniTest.run()"

  # The one check branch protection requires: every job above passed. Their
  # names change with the Neovim versions, this one does not.
  ci:
    name: All checks
    if: always()
    needs: [format, lint, build, versions, test-engine, test, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(. == "success")'
