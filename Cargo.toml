[package]
name = "markup"
version = "0.1.0"
edition = "2024"

[lib]
path = "lua/markup/rust/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
taffy = { version = "0.8.3", features = ["content_size", "serde"] }
serde = { version = "1.0.216", features = ["derive"] }
mlua = { version = "0.11.1", features = ["module", "luajit", "serialize"] }
