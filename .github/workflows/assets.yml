name: Release assets

# Makes a release complete before anyone sees it. release-please saves each
# release as a draft, which has no tag yet. This builds the engine for each
# platform and zips the skill, and only once all of it built does it attach
# the files, with their SHA-256 sums, and publish the release, which is when
# GitHub creates the tag. A failed build leaves the draft as it is.
#
# The Release workflow calls it right after release-please makes the draft:
# GitHub starts no workflow for the events of a draft release, so it cannot
# wait for one. By hand it takes the tag and, for a draft, the commit of the
# release, since its tag does not exist yet; for a release already out it
# builds the files again and replaces them.

on:
  workflow_call:
    inputs:
      tag:
        description: Tag of the release, such as v0.3.0
        type: string
        required: true
      ref:
        description: Commit of the release
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release, such as v0.3.0
        required: true
      ref:
        description: Commit of the release, for a draft whose tag does not exist yet (default the tag)
        required: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag }}
  REF: ${{ inputs.ref || inputs.tag }}

jobs:
  engine:
    name: Engine (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, asset: linux-x86_64, lib: libmarkup_core.so }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, asset: linux-arm64, lib: libmarkup_core.so }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: macos-arm64, lib: libmarkup_core.dylib }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: macos-x86_64, lib: libmarkup_core.dylib }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: windows-x86_64, lib: markup_core.dll }
    env:
      # The oldest macOS the engine runs on, rather than the runner's.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      # The commit must be the release's: its Cargo.toml says the version.
      - name: Check the version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::$REF has version $version, not ${TAG#v}"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      # Named for the platform, with the extension the library has there.
      - name: Name it for the platform
        shell: bash
        run: |
          lib=target/${{ matrix.target }}/release/${{ matrix.lib }}
          mkdir -p out
          cp "$lib" "out/markup_core-${{ matrix.asset }}.${lib##*.}"
      - uses: rhysd/action-setup-vim@v1
        if: matrix.asset == 'linux-x86_64'
        with:
          neovim: true
          version: stable
      - name: Load the packaged Linux engine in Neovim
        if: matrix.asset == 'linux-x86_64'
        run: |
          nvim --clean --headless -l /dev/stdin <<'LUA'
          vim.opt.runtimepath:prepend(vim.fn.getcwd())
          local load_engine = assert(package.loadlib("out/markup_core-linux-x86_64.so", "luaopen_markup_core"))
          local version = require("markup.config").version
          assert(load_engine().version == version and "v" .. version == vim.env.TAG)
          LUA
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.asset }}
          path: out/*
          if-no-files-found: error

  skill:
    name: Skill
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      # The skill folder as it is, for agents and apps that take a zip.
      - run: |
          mkdir -p out
          (cd skills && zip -qr ../out/markup-nvim-skill.zip markup-nvim)
      - uses: actions/upload-artifact@v4
        with:
          name: skill
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [engine, skill]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      # build.lua checks what it downloads against these.
      - name: Sums
        working-directory: out
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Attach and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" out/* --clobber --repo "${{ github.repository }}"
          # Publishing makes the tag, now that every file is there.
          gh release edit "$TAG" --draft=false --repo "${{ github.repository }}"
