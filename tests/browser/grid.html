<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0; font: 20px/20px monospace; font-size-adjust: ch-width 0.5; font-variant-ligatures: none; }
  main { display: flow-root; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
<main style="width:WIDTHch">CONTENT</main>
<output></output>
<script>
  const root = document.querySelector("main");
  const origin = root.getBoundingClientRect();
  const cellWidth = origin.width / WIDTH;
  const lineHeight = parseFloat(getComputedStyle(root).lineHeight);
  const boxes = [];
  function visit(parent, path) {
    Array.from(parent.children).forEach((element, index) => {
      const childPath = path + "/" + (index + 1);
      if (element.tagName === "DIV") {
        const rect = element.getBoundingClientRect();
        boxes.push({
          path: childPath,
          display: getComputedStyle(element).display,
          rect: [(rect.x - origin.x) / cellWidth, (rect.y - origin.y) / lineHeight,
                 rect.width / cellWidth, rect.height / lineHeight]
        });
      }
      visit(element, childPath);
    });
  }
  visit(root, "");
  document.querySelector("output").textContent = btoa(JSON.stringify(boxes));
</script>
