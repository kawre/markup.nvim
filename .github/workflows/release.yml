name: Release

# release-please keeps a pull request "chore(master): release x.y.z" up to date
# from the conventional commits on master: the version in Cargo.toml,
# lua/markup/config.lua and the lines of the docs marked
# `x-release-please-version`, and CHANGELOG.md. Merging it tags the commit and
# makes the GitHub release, which assets.yml then gives the engine for each
# platform and the skill as a zip. The Claude Code plugin in .claude-plugin
# carries the same version.
#
# Its pull request needs CI to pass like any other. A pull request opened with
# the default GITHUB_TOKEN starts no workflow, so set RELEASE_PLEASE_TOKEN: a
# fine-grained token for this repository with Contents and Pull requests
# read and write.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
