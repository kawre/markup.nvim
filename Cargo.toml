[package]
name = "markup"
version = "0.1.0"
edition = "2021"

[lib]
path = "lua/markup/rust/lib.rs"
crate-type = ["cdylib"]

[dependencies]
taffy = "0.8.3"
lazy_static = "1.5.0"
once_cell = "1.21.3"
serde = { version = "1.0.216", features = ["derive"] }
mlua = { version = "0.11.1", features = ["module", "luajit"] }
