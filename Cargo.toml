[package]
name = "markup"
version = "0.1.0"
edition = "2024"

[lib]
path = "lua/markup/core/lib.rs"
name = "markup_core"
crate-type = ["rlib", "cdylib"]

[profile.dev]
debug = true

[dependencies]
taffy = { version = "0.8.3", features = ["content_size", "serde"] }
serde = { version = "1.0.216", features = ["derive"] }
mlua = { version = "0.11.1", features = ["module", "luajit", "serialize"] }
bitflags = "2.9.1"
serde_json = "1.0.142"
